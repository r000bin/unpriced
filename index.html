<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>True Value Calculator — Your life's work beyond income</title>
  <meta name="description" content="Research-backed estimates of the real value you create — for yourself, your community & the planet." />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #0e0e0e; -webkit-font-smoothing: antialiased; }
    input[type="range"] { -webkit-appearance: none; appearance: none; height: 6px; background: transparent; }
    input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; height: 22px; width: 22px; border-radius: 50%; cursor: pointer; }
    input[type="range"]::-moz-range-thumb { height: 22px; width: 22px; border-radius: 50%; cursor: pointer; border: none; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <script type="text/babel">
const { useState } = React;

const CHF_PER_VOLUNTEER_HOUR = 16;
const EXERCISE_SAVING_PER_WEEK_HOUR = 35;
const CO2_PER_SECONDHAND_ITEM_KG = 10;
const CHF_PER_TON_CO2 = 130;

const categories = [
  {
    id: "body", label: "Body & Health", emoji: "🫀", color: "#e85d4a",
    description: "Investing in your physical vessel",
    research: "Physical inactivity costs $117B/yr in healthcare (CDC). Regularly active people save $500–$2,500/yr in medical costs (JAMA 2023, Baptist Health). High-fit adults have 40% lower average healthcare costs after 65 (JACC).",
    activities: [
      { id: "exercise", label: "Exercise / Movement", unit: "hrs/week", max: 20, tip: "Running, yoga, cycling, hiking...",
        benchmarks: [{ v: 2.5, label: "WHO min" }, { v: 5, label: "WHO optimal" }, { v: 10, label: "Athlete" }],
        monetaryFn: v => Math.round(v * EXERCISE_SAVING_PER_WEEK_HOUR * 52),
        monetaryLabel: v => `≈ CHF ${Math.round(v * EXERCISE_SAVING_PER_WEEK_HOUR * 52).toLocaleString("de-CH")}/yr healthcare savings avoided` },
      { id: "sleep", label: "Quality Sleep", unit: "hrs/night avg", max: 10, tip: "7–9h optimal — poor sleep costs ~$411B/yr (RAND)",
        benchmarks: [{ v: 6, label: "Minimum" }, { v: 7.5, label: "Recommended" }, { v: 9, label: "Optimal" }],
        monetaryFn: null, monetaryLabel: () => "Poor sleep costs ~$411B/yr in lost productivity (RAND Europe)" },
      { id: "cooking", label: "Home cooking", unit: "meals/week", max: 21, tip: "Fresh, whole-food meals vs. processed / takeaway",
        benchmarks: [{ v: 7, label: "1×/day" }, { v: 14, label: "2×/day" }, { v: 21, label: "All meals" }],
        monetaryFn: v => Math.round(v * 8 * 52),
        monetaryLabel: v => `≈ CHF ${Math.round(v * 8 * 52).toLocaleString("de-CH")}/yr saved vs. eating out` },
      { id: "medical", label: "Preventive care", unit: "appts/year", max: 12, tip: "Checkups, therapy, physio, dentist...",
        benchmarks: [{ v: 2, label: "Basics" }, { v: 4, label: "Good" }, { v: 8, label: "Thorough" }],
        monetaryFn: null, monetaryLabel: () => "Prevention saves 10–100× treatment costs (WHO)" },
    ],
  },
  {
    id: "mind", label: "Mind & Soul", emoji: "🧠", color: "#5b8dee",
    description: "Nurturing your inner life",
    research: "Mindfulness reduces anxiety & depression risk by 30–50% (Lancet Psychiatry 2021). Burnout costs CHF 10k–50k per episode in lost productivity (SECO). Lifelong learning adds years of cognitive health (Lancet Commission on Dementia 2020).",
    activities: [
      { id: "meditation", label: "Mindfulness / Meditation", unit: "min/day", max: 60, tip: "Presence, breathing, journaling",
        benchmarks: [{ v: 10, label: "Starter" }, { v: 20, label: "Recommended" }, { v: 45, label: "Deep practice" }],
        monetaryFn: null, monetaryLabel: () => "Reduces anxiety risk by up to 30% (Lancet Psychiatry 2021)" },
      { id: "learning", label: "Learning something new", unit: "hrs/week", max: 15, tip: "Books, courses, languages, skills",
        benchmarks: [{ v: 2, label: "Casual" }, { v: 5, label: "Committed" }, { v: 10, label: "Serious" }],
        monetaryFn: v => Math.round(v * 50 * 52),
        monetaryLabel: v => `≈ CHF ${Math.round(v * 50 * 52).toLocaleString("de-CH")}/yr in skill value (avg course cost proxy)` },
      { id: "creativity", label: "Creative expression", unit: "hrs/week", max: 20, tip: "Art, music, writing, crafts, gardening",
        benchmarks: [{ v: 2, label: "Hobby" }, { v: 5, label: "Regular" }, { v: 10, label: "Dedicated" }],
        monetaryFn: null, monetaryLabel: () => "Proven to reduce cortisol & boost life satisfaction (APA)" },
      { id: "therapy", label: "Therapy / Self-reflection", unit: "sessions/month", max: 8, tip: "Intentional inner work",
        benchmarks: [{ v: 1, label: "Maintenance" }, { v: 2, label: "Regular" }, { v: 4, label: "Intensive" }],
        monetaryFn: null, monetaryLabel: () => "Prevents burnout worth CHF 10k–50k/episode (SECO)" },
    ],
  },
  {
    id: "community", label: "Community", emoji: "🤝", color: "#f0a500",
    description: "Freiwilligen-Arbeit & care",
    research: "Switzerland leads Europe in volunteering: 590M hours/yr (Freiwilligen-Monitor 2025, SGG). Replacement value: CHF 13.90–18.80/hr (SRF/SGG 2025). BFS 2024: 376M hrs informal care given — 200M hrs just for children.",
    activities: [
      { id: "volunteer", label: "Freiwilligen-Arbeit (Verein etc.)", unit: "hrs/week", max: 20, tip: "Feuerwehr, Elternrat, charity, sport...",
        benchmarks: [{ v: 1, label: "CH avg" }, { v: 3, label: "Active" }, { v: 8, label: "Dedicated" }],
        monetaryFn: v => Math.round(v * CHF_PER_VOLUNTEER_HOUR * 52),
        monetaryLabel: v => `≈ CHF ${Math.round(v * CHF_PER_VOLUNTEER_HOUR * 52).toLocaleString("de-CH")}/yr replacement value (BFS/SGG 2025)` },
      { id: "informal_help", label: "Informal help / Nachbarschaft", unit: "hrs/week", max: 20, tip: "Neighbors, childcare, elder care",
        benchmarks: [{ v: 1, label: "Occasional" }, { v: 3, label: "Regular" }, { v: 7, label: "Heavy" }],
        monetaryFn: v => Math.round(v * CHF_PER_VOLUNTEER_HOUR * 52),
        monetaryLabel: v => `≈ CHF ${Math.round(v * CHF_PER_VOLUNTEER_HOUR * 52).toLocaleString("de-CH")}/yr (CH: 376M such hrs given in 2024)` },
      { id: "mentoring", label: "Mentoring / Teaching", unit: "hrs/week", max: 10, tip: "Sharing skills, coaching, tutoring",
        benchmarks: [{ v: 1, label: "Casual" }, { v: 3, label: "Regular" }, { v: 5, label: "Serious" }],
        monetaryFn: v => Math.round(v * 80 * 52),
        monetaryLabel: v => `≈ CHF ${Math.round(v * 80 * 52).toLocaleString("de-CH")}/yr (market rate CHF 80+/hr)` },
      { id: "community_org", label: "Community / Gemeinde work", unit: "hrs/month", max: 30, tip: "Local politics, associations, initiatives",
        benchmarks: [{ v: 4, label: "Occasional" }, { v: 8, label: "Active" }, { v: 16, label: "Board" }],
        monetaryFn: v => Math.round(v * CHF_PER_VOLUNTEER_HOUR * 12),
        monetaryLabel: v => `≈ CHF ${Math.round(v * CHF_PER_VOLUNTEER_HOUR * 12).toLocaleString("de-CH")}/yr` },
    ],
  },
  {
    id: "planet", label: "Planet & Ecology", emoji: "🌱", color: "#3dba6f",
    description: "Acts that heal the earth",
    research: "Second-hand clothing: up to 42% lower CO2 per use vs. new (Circular Economy Journal 2024). A used sofa saves ~131 kg CO2 (Carousell/Vaayu 2022). Extending garment life by 9 months cuts carbon footprint by 20–30% (EEA 2022). Switzerland CO2 levy: CHF 130/tonne.",
    activities: [
      { id: "secondhand", label: "Buying second-hand clothing", unit: "items/month", max: 20, tip: "Brocki, Vinted, Ricardo, swaps...",
        benchmarks: [{ v: 2, label: "Occasional" }, { v: 5, label: "Regular" }, { v: 10, label: "Committed" }],
        monetaryFn: v => Math.round(v * 12 * CO2_PER_SECONDHAND_ITEM_KG),
        monetaryLabel: v => `≈ ${Math.round(v * 12 * CO2_PER_SECONDHAND_ITEM_KG)} kg CO₂ avoided/yr (Circular Economy Journal 2024)` },
      { id: "gardening", label: "Gardening / Native plants", unit: "hrs/week", max: 15, tip: "Wildflowers, food, compost, rewilding",
        benchmarks: [{ v: 2, label: "Casual" }, { v: 5, label: "Hobby" }, { v: 10, label: "Serious" }],
        monetaryFn: null, monetaryLabel: () => "Biodiversity + food + wellbeing — value beyond metrics" },
      { id: "repair", label: "Repairing instead of buying", unit: "items/month", max: 10, tip: "Fixing clothes, electronics, bikes",
        benchmarks: [{ v: 1, label: "Occasional" }, { v: 3, label: "Handy" }, { v: 6, label: "Dedicated" }],
        monetaryFn: v => Math.round(v * 50 * 12),
        monetaryLabel: v => `≈ CHF ${Math.round(v * 50 * 12).toLocaleString("de-CH")}/yr production cost avoided` },
      { id: "lowimpact", label: "Low-impact daily choices", unit: "choices/day", max: 10, tip: "Bike instead of car, plant-based meals...",
        benchmarks: [{ v: 2, label: "Starting" }, { v: 4, label: "Conscious" }, { v: 7, label: "Committed" }],
        monetaryFn: null, monetaryLabel: () => "1 plant meal = ~1.5 kg CO₂ saved vs. beef meal (PLOS ONE)" },
    ],
  },
  {
    id: "relations", label: "Relationships", emoji: "💛", color: "#d97ae8",
    description: "Tending to meaningful connections",
    research: "Strong social ties = 50% better survival odds — equivalent to quitting smoking (Holt-Lunstad et al. 2010, PLOS Medicine). Loneliness costs EU €40B/yr (EU Commission 2023). Each act of kindness measurably boosts giver wellbeing (PNAS 2022).",
    activities: [
      { id: "deepconv", label: "Deep conversations", unit: "hrs/week", max: 15, tip: "Real talk with people you trust",
        benchmarks: [{ v: 1, label: "Minimal" }, { v: 3, label: "Healthy" }, { v: 7, label: "Rich" }],
        monetaryFn: null, monetaryLabel: () => "Social bonds = 50% better survival odds (Holt-Lunstad 2010)" },
      { id: "friendship", label: "Nurturing friendships", unit: "meetups/week", max: 14, tip: "Showing up for others",
        benchmarks: [{ v: 1, label: "Occasional" }, { v: 3, label: "Social" }, { v: 7, label: "Very social" }],
        monetaryFn: null, monetaryLabel: () => "Loneliness costs ~$6,700/yr per isolated person (CIGNA)" },
      { id: "acts_kindness", label: "Acts of kindness", unit: "per week", max: 20, tip: "Small gestures that ripple outward",
        benchmarks: [{ v: 3, label: "Natural" }, { v: 7, label: "Intentional" }, { v: 15, label: "Generous" }],
        monetaryFn: null, monetaryLabel: () => "Measurably boosts giver wellbeing (PNAS 2022)" },
      { id: "caregiving", label: "Caregiving (children/elders)", unit: "hrs/week", max: 40, tip: "Unpaid care work — the backbone of society",
        benchmarks: [{ v: 5, label: "Light" }, { v: 15, label: "Part-time" }, { v: 30, label: "Full-time" }],
        monetaryFn: v => Math.round(v * CHF_PER_VOLUNTEER_HOUR * 52),
        monetaryLabel: v => `≈ CHF ${Math.round(v * CHF_PER_VOLUNTEER_HOUR * 52).toLocaleString("de-CH")}/yr (ILO: unpaid care = 9% global GDP)` },
    ],
  },
];

const weights = { body: 22, mind: 20, community: 22, planet: 20, relations: 16 };

function scoreAct(value, max) { return !value ? 0 : Math.min(1, value / (max * 0.6)); }
function catScore(cat, values) {
  const s = cat.activities.map(a => scoreAct(values[a.id] || 0, a.max));
  return s.reduce((a, b) => a + b, 0) / s.length;
}
function totalScore(values) {
  return Math.round(categories.reduce((t, c) => t + catScore(c, values) * weights[c.id] / 100, 0) * 100);
}
function computeMonetary(values) {
  let total = 0;
  for (const cat of categories)
    for (const act of cat.activities)
      if (act.monetaryFn) total += act.monetaryFn(values[act.id] || 0);
  return total;
}
function getVerdict(score) {
  if (score >= 80) return { label: "Thriving Contributor", msg: "You're living a life that genuinely enriches the world.", color: "#3dba6f" };
  if (score >= 60) return { label: "Meaningful Life", msg: "Strong foundations — a few areas could bloom further.", color: "#f0a500" };
  if (score >= 40) return { label: "Growing Awareness", msg: "You're building something real. Keep going.", color: "#5b8dee" };
  if (score >= 20) return { label: "Seeds Planted", msg: "Small acts matter. Every step counts.", color: "#e85d4a" };
  return { label: "Begin Anywhere", msg: "One tiny act today changes tomorrow.", color: "#555" };
}

const Ring = ({ pct, color, size = 52 }) => {
  const r = size * 0.38, circ = 2 * Math.PI * r, dash = (pct / 100) * circ, cx = size / 2, cy = size / 2;
  return (
    <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`}>
      <circle cx={cx} cy={cy} r={r} fill="none" stroke="#1a1a1a" strokeWidth={size * 0.1} />
      <circle cx={cx} cy={cy} r={r} fill="none" stroke={color} strokeWidth={size * 0.1}
        strokeDasharray={`${dash} ${circ}`} strokeLinecap="round"
        transform={`rotate(-90 ${cx} ${cy})`}
        style={{ transition: "stroke-dasharray 0.8s cubic-bezier(.4,0,.2,1)" }} />
      <text x={cx} y={cy + 4} textAnchor="middle" fill={color} fontSize={size * 0.18}
        fontWeight="700" fontFamily="'DM Mono',monospace">{pct}</text>
    </svg>
  );
};

function App() {
  const [values, setValues] = useState({});
  const [activeTab, setActiveTab] = useState("body");
  const [showResearch, setShowResearch] = useState(null);

  const score = totalScore(values);
  const verdict = getVerdict(score);
  const monetary = computeMonetary(values);
  const activeCat = categories.find(c => c.id === activeTab);

  return (
    <div style={{ minHeight: "100vh", background: "#0e0e0e", color: "#e8e8e8", fontFamily: "'DM Sans', sans-serif", fontSize: 16, paddingBottom: 80 }}>
      <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,400&family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500;700&display=swap" rel="stylesheet" />

      <div style={{ padding: "44px 20px 0", maxWidth: 600, margin: "0 auto", textAlign: "center" }}>
        <div style={{ fontSize: 13, letterSpacing: 4, textTransform: "uppercase", color: "#666", marginBottom: 12 }}>True Value Calculator</div>
        <h1 style={{ fontSize: 36, fontFamily: "'Playfair Display', serif", fontWeight: 700, lineHeight: 1.25, margin: "0 0 10px",
          background: "linear-gradient(130deg, #e8e8e8 0%, #777 100%)",
          WebkitBackgroundClip: "text", WebkitTextFillColor: "transparent" }}>
          Your life's work<br /><em style={{ fontStyle: "italic" }}>beyond income</em>
        </h1>
        <p style={{ color: "#888", fontSize: 16, lineHeight: 1.7, maxWidth: 420, margin: "0 auto" }}>
          Research-backed estimates of the real value you create — for yourself, your community &amp; the planet.
        </p>
      </div>

      <div style={{ maxWidth: 600, margin: "0 auto", padding: "0 16px" }}>

        {/* Big ring */}
        <div style={{ display: "flex", flexDirection: "column", alignItems: "center", gap: 10, padding: "28px 0 20px" }}>
          <div style={{ position: "relative", width: 180, height: 180 }}>
            {(() => {
              const r = 72, circ = 2 * Math.PI * r, dash = (score / 100) * circ;
              return (
                <svg width="180" height="180" viewBox="0 0 180 180">
                  <circle cx="90" cy="90" r={r} fill="none" stroke="#1a1a1a" strokeWidth="13" />
                  <circle cx="90" cy="90" r={r} fill="none" stroke={verdict.color} strokeWidth="13"
                    strokeDasharray={`${dash} ${circ}`} strokeLinecap="round" transform="rotate(-90 90 90)"
                    style={{ transition: "stroke-dasharray 1s cubic-bezier(.4,0,.2,1)" }} />
                </svg>
              );
            })()}
            <div style={{ position: "absolute", inset: 0, display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center" }}>
              <span style={{ fontSize: 46, fontWeight: 800, color: verdict.color, fontFamily: "'DM Mono',monospace", lineHeight: 1 }}>{score}</span>
              <span style={{ fontSize: 13, color: "#777", letterSpacing: 2, textTransform: "uppercase" }}>/100</span>
            </div>
          </div>
          <div style={{ textAlign: "center" }}>
            <div style={{ fontSize: 22, fontWeight: 700, color: verdict.color, fontFamily: "'Playfair Display',serif" }}>{verdict.label}</div>
            <div style={{ fontSize: 16, color: "#888", marginTop: 4 }}>{verdict.msg}</div>
          </div>
        </div>

        {/* Monetary banner */}
        {monetary > 0 && (
          <div style={{ background: "#111", border: "1px solid #3dba6f2a", borderRadius: 14,
            padding: "16px 18px", marginBottom: 16, display: "flex", justifyContent: "space-between", alignItems: "center" }}>
            <div>
              <div style={{ fontSize: 12, letterSpacing: 3, textTransform: "uppercase", color: "#3dba6f99", marginBottom: 4 }}>Estimated annual real value</div>
              <div style={{ fontSize: 26, fontFamily: "'DM Mono',monospace", color: "#3dba6f", fontWeight: 700 }}>
                CHF {monetary.toLocaleString("de-CH")}
              </div>
            </div>
            <div style={{ fontSize: 13, color: "#777", maxWidth: 140, textAlign: "right", lineHeight: 1.5 }}>
              Swiss replacement costs &amp; research benchmarks
            </div>
          </div>
        )}

        {/* Mini category rings */}
        <div style={{ display: "flex", gap: 4, marginBottom: 18, background: "#111", borderRadius: 16, padding: "12px 6px",
          overflowX: "auto", WebkitOverflowScrolling: "touch" }}>
          {categories.map(cat => {
            const s = Math.round(catScore(cat, values) * 100);
            return (
              <button key={cat.id} onClick={() => setActiveTab(cat.id)}
                style={{ flex: "1 0 60px", background: "none", border: "none", cursor: "pointer",
                  display: "flex", flexDirection: "column", alignItems: "center", gap: 4, padding: "6px 4px",
                  borderRadius: 10, outline: activeTab === cat.id ? `2px solid ${cat.color}` : "2px solid transparent",
                  transition: "outline 0.2s", minWidth: 0 }}>
                <Ring pct={s} color={cat.color} size={54} />
                <span style={{ fontSize: 16, lineHeight: 1 }}>{cat.emoji}</span>
              </button>
            );
          })}
        </div>

        {/* Active category */}
        <div style={{ background: "#111", borderRadius: 18, border: `1px solid ${activeCat.color}1a`, marginBottom: 16, overflow: "hidden" }}>
          <div style={{ padding: "14px 18px 12px", borderBottom: "1px solid #1a1a1a",
            display: "flex", alignItems: "center", justifyContent: "space-between" }}>
            <div style={{ display: "flex", alignItems: "center", gap: 12 }}>
              <span style={{ fontSize: 22 }}>{activeCat.emoji}</span>
              <div>
                <div style={{ fontWeight: 600, color: activeCat.color, fontSize: 18 }}>{activeCat.label}</div>
                <div style={{ fontSize: 14, color: "#888" }}>{activeCat.description}</div>
              </div>
            </div>
            <button onClick={() => setShowResearch(r => r === activeCat.id ? null : activeCat.id)}
              style={{ background: "none", border: `1px solid ${activeCat.color}44`, borderRadius: 8,
                padding: "6px 12px", fontSize: 12, color: activeCat.color + "cc", cursor: "pointer",
                letterSpacing: 1.5, textTransform: "uppercase" }}>
              {showResearch === activeCat.id ? "Hide" : "Sources"}
            </button>
          </div>

          {showResearch === activeCat.id && (
            <div style={{ padding: "12px 18px", background: `${activeCat.color}06`,
              borderBottom: "1px solid #1a1a1a", fontSize: 14, color: "#999",
              lineHeight: 1.7, fontStyle: "italic" }}>
              {activeCat.research}
            </div>
          )}

          <div style={{ padding: "14px 18px 20px", display: "flex", flexDirection: "column", gap: 22 }}>
            {activeCat.activities.map(act => {
              const val = values[act.id] || 0;
              const pct = Math.round((val / act.max) * 100);
              return (
                <div key={act.id}>
                  <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", marginBottom: 6 }}>
                    <div style={{ flex: 1, paddingRight: 8 }}>
                      <div style={{ fontSize: 17, fontWeight: 500, color: "#ddd" }}>{act.label}</div>
                      <div style={{ fontSize: 14, color: "#777", marginTop: 2 }}>{act.tip}</div>
                      {val > 0 && (
                        <div style={{ fontSize: 13, color: act.monetaryFn ? activeCat.color : "#888",
                          marginTop: 4, opacity: act.monetaryFn ? 0.9 : 0.7 }}>
                          {act.monetaryFn ? "≈ " : ""}{act.monetaryLabel(val)}
                        </div>
                      )}
                    </div>
                    <div style={{ fontFamily: "'DM Mono',monospace", fontSize: 16,
                      color: pct > 0 ? activeCat.color : "#555", minWidth: 36, textAlign: "right" }}>
                      {val > 0 ? val : "—"}
                    </div>
                  </div>
                  <div style={{ position: "relative", height: 10, background: "#1a1a1a", borderRadius: 99 }}>
                    <div style={{ position: "absolute", top: 0, left: 0, height: "100%", width: `${pct}%`, borderRadius: 99,
                      background: `linear-gradient(90deg, ${activeCat.color}55, ${activeCat.color})`,
                      transition: "width 0.4s cubic-bezier(.4,0,.2,1)" }} />
                    {act.benchmarks && act.benchmarks.map((bm, bi) => (
                      <div key={bi} style={{ position: "absolute", left: `${(bm.v / act.max) * 100}%`, top: -2,
                        width: 2, height: 14, background: val >= bm.v ? activeCat.color + "88" : "#444",
                        transition: "background 0.3s" }} />
                    ))}
                  </div>
                  <input type="range" min={0} max={act.max} step={act.max > 10 ? 1 : 0.5}
                    value={val}
                    onChange={e => setValues(v => ({ ...v, [act.id]: parseFloat(e.target.value) }))}
                    style={{ width: "100%", marginTop: 6, accentColor: activeCat.color, cursor: "pointer", height: 22 }} />
                  {act.benchmarks ? (
                    <div style={{ display: "flex", justifyContent: "space-between", fontSize: 11, marginTop: 2, color: "#555" }}>
                      <span style={{ color: "#555" }}>0</span>
                      {act.benchmarks.map((bm, bi) => (
                        <span key={bi} style={{ color: val >= bm.v ? activeCat.color + "bb" : "#555",
                          transition: "color 0.3s", textAlign: "center" }}>
                          {bm.v} · {bm.label}
                        </span>
                      ))}
                      <span style={{ color: "#555" }}>{act.max}</span>
                    </div>
                  ) : (
                    <div style={{ display: "flex", justifyContent: "space-between", fontSize: 11, marginTop: 2, color: "#555" }}>
                      <span>0</span><span>{act.unit}</span><span>{act.max}</span>
                    </div>
                  )}
                </div>
              );
            })}
          </div>
        </div>

        {/* Nav pills */}
        <div style={{ display: "flex", gap: 8, flexWrap: "wrap", marginBottom: 20 }}>
          {categories.map(cat => (
            <button key={cat.id} onClick={() => setActiveTab(cat.id)}
              style={{ padding: "8px 14px", borderRadius: 99, fontSize: 14, fontWeight: 500,
                border: `1px solid ${activeTab === cat.id ? cat.color : "#333"}`,
                background: activeTab === cat.id ? `${cat.color}14` : "transparent",
                color: activeTab === cat.id ? cat.color : "#888",
                cursor: "pointer", transition: "all 0.2s" }}>
              {cat.emoji} {cat.label}
            </button>
          ))}
        </div>

        {/* Breakdown */}
        {score > 0 && (
          <div style={{ background: "#111", borderRadius: 14, border: "1px solid #1a1a1a", padding: "18px", marginBottom: 16 }}>
            <div style={{ fontSize: 12, letterSpacing: 3, textTransform: "uppercase", color: "#777", marginBottom: 12 }}>Breakdown</div>
            {categories.map(cat => {
              const s = Math.round(catScore(cat, values) * 100);
              return (
                <div key={cat.id} style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 10 }}>
                  <span style={{ fontSize: 16, width: 22 }}>{cat.emoji}</span>
                  <div style={{ flex: 1, height: 4, background: "#1a1a1a", borderRadius: 99, overflow: "hidden" }}>
                    <div style={{ height: "100%", width: `${s}%`, background: cat.color, borderRadius: 99, transition: "width 0.6s ease" }} />
                  </div>
                  <span style={{ fontFamily: "'DM Mono',monospace", fontSize: 14, color: s > 40 ? cat.color : "#666", width: 32, textAlign: "right" }}>{s}%</span>
                  <span style={{ fontSize: 14, color: "#888", width: 100 }}>{cat.label}</span>
                </div>
              );
            })}
            <div style={{ marginTop: 14, paddingTop: 14, borderTop: "1px solid #1a1a1a",
              fontSize: 15, color: "#888", fontFamily: "'Playfair Display',serif", fontStyle: "italic", lineHeight: 1.7 }}>
              "The market knows the price of everything and the value of nothing."
              <span style={{ display: "block", fontSize: 13, fontStyle: "normal",
                fontFamily: "'DM Sans',sans-serif", color: "#666", marginTop: 3 }}>— Oscar Wilde</span>
            </div>
          </div>
        )}

        {/* Sources */}
        <div style={{ background: "#0c0c0c", borderRadius: 12, border: "1px solid #161616", padding: "16px 16px" }}>
          <div style={{ fontSize: 12, letterSpacing: 2.5, textTransform: "uppercase", color: "#777", marginBottom: 10 }}>Research sources</div>
          {[
            ["🇨🇭", "Freiwilligen-Monitor Schweiz 2025 (SGG/Lamprecht & Stamm) — CHF 13.90–18.80/hr volunteer replacement value"],
            ["🇨🇭", "BFS SAKE 2024 — 590M volunteer hours, 376M informal care hours per year in Switzerland"],
            ["🌍", "Circular Economy Journal 2024 — second-hand clothing: up to 42% lower CO₂ per use vs. new"],
            ["🇺🇸", "CDC 2024 — physical inactivity linked to $117B/yr in US healthcare costs"],
            ["🏥", "JAMA / Baptist Health 2023 — regular exercise saves $500–$2,500/yr per person in medical costs"],
            ["🛋️", "Carousell/Vaayu 2022 — used sofa saves ~131 kg CO₂; used smartphone ~47 kg"],
            ["👩‍👧", "ILO 2018 — 16.4B hrs unpaid care daily = 9% of global GDP if valued at minimum wage"],
            ["❤️", "Holt-Lunstad et al., PLOS Medicine 2010 — strong social ties = 50% better survival odds"],
          ].map(([icon, text], i) => (
            <div key={i} style={{ display: "flex", gap: 8, fontSize: 13, color: "#888",
              lineHeight: 1.6, marginBottom: 5, paddingLeft: 8, borderLeft: "1px solid #333" }}>
              <span style={{ opacity: 0.6 }}>{icon}</span><span>{text}</span>
            </div>
          ))}
        </div>

      </div>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
  </script>
</body>
</html>
